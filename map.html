<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Map — The Compendium</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow: hidden; }
    .map-layout { display: grid; grid-template-columns: 220px 1fr 180px; height: calc(100vh - 48px); overflow: hidden; }

    .maps-panel { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .maps-panel-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .maps-panel-header h3 { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dim); }
    .maps-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .map-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; transition: all 0.15s; }
    .map-item:hover { background: var(--panel); border-color: var(--border); }
    .map-item.active { background: var(--panel); border-color: var(--gold-dim); }
    .map-item-name { font-family: var(--font-display); font-size: 0.8rem; color: var(--gold-pale); }
    .map-item-size { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
    .map-item-del { float: right; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.8rem; padding: 0; }
    .map-item-del:hover { color: var(--red); }
    .new-map-btn { margin: 0.5rem; flex-shrink: 0; }

    .canvas-wrap { position: relative; overflow: hidden; background: #171d29; cursor: crosshair; }
    #three-container { position: absolute; inset: 0; }
    #three-container canvas { display: block; }
    .canvas-toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 10; flex-wrap: wrap; }
    .tool-btn { background: var(--panel); border: 1px solid var(--border2); border-radius: 6px; color: var(--text-muted); cursor: pointer; font-size: 0.7rem; padding: 5px 10px; font-family: var(--font-display); letter-spacing: 0.06em; transition: all 0.15s; }
    .tool-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
    .tool-btn.active { border-color: var(--gold); color: var(--gold); background: var(--bg3); }
    .canvas-info { position: absolute; bottom: 10px; left: 10px; font-size: 0.7rem; color: var(--text-dim); font-family: var(--font-display); background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 4px; }
    .canvas-hint { position: absolute; top: 10px; right: 10px; font-size: 0.65rem; color: var(--text-dim); font-family: var(--font-display); background: rgba(0,0,0,0.6); padding: 5px 9px; border-radius: 4px; line-height: 1.6; text-align: right; z-index: 10; }
    .zoom-btns { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 4px; }
    .zoom-btn { background: var(--panel); border: 1px solid var(--border2); border-radius: 4px; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
    .zoom-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
    .no-map { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 1rem; color: var(--text-dim); }
    .no-map p { font-style: italic; }

    .palette-panel { background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .palette-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .palette-header h3 { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 6px; }
    .palette-tabs { display: flex; gap: 4px; }
    .pal-tab { font-size: 0.65rem; font-family: var(--font-display); padding: 3px 8px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); color: var(--text-dim); background: none; letter-spacing: 0.06em; }
    .pal-tab.active { border-color: var(--gold-dim); color: var(--gold); background: var(--bg3); }
    .palette-tiles { flex: 1; overflow-y: auto; padding: 0.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tile-btn { border-radius: 6px; border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px; transition: border-color 0.15s; background: var(--panel); }
    .tile-btn:hover { border-color: var(--border2); }
    .tile-btn.selected { border-color: var(--gold); }
    .tile-swatch { width: 100%; height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .tile-label { font-size: 0.6rem; font-family: var(--font-display); letter-spacing: 0.05em; color: var(--text-dim); text-align: center; }
    .eraser-btn { grid-column: 1 / -1; }
    .eraser-btn.selected { border-color: var(--red); }

    .session-bar { padding: 0.5rem; border-top: 1px solid var(--border); flex-shrink: 0; }
    .session-btn { width: 100%; padding: 8px; font-size: 0.7rem; letter-spacing: 0.08em; }
    .session-btn.live { border-color: var(--red-dim); color: var(--red-dim); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; padding: 1.5rem; width: min(360px,90vw); display: flex; flex-direction: column; gap: 1rem; }
    .modal h3 { font-size: 1.1rem; }
    .modal-fields { display: flex; flex-direction: column; gap: 0.75rem; }
    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    select { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 1rem; width: 100%; }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav-logo">⚔ The Compendium</span>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="party.html">Party</a>
      <a href="chat.html">Chat</a>
      <a href="minigame.html">Dice Oracle</a>
      <a href="colors.html">Colours</a>
      <a href="map.html" class="active">Map</a>
    </div>

  <div class="map-layout" id="map-layout">
    <div class="maps-panel">
      <div class="maps-panel-header"><h3>Maps</h3></div>
      <div class="maps-list" id="maps-list"><div style="color:var(--text-dim);font-size:0.8rem;font-style:italic;padding:8px;">Loading...</div></div>
      <button class="primary new-map-btn" onclick="openNewMapModal()">+ New Map</button>
    </div>

    <div class="canvas-wrap" id="canvas-wrap">
      <div class="no-map" id="no-map-msg">
        <span style="font-size:2.5rem;">🗺</span>
        <p>Create or select a map to begin building.</p>
        <button class="primary" onclick="openNewMapModal()">+ New Map</button>
      </div>
      <div id="three-container" style="display:none;"></div>
      <div class="canvas-toolbar" id="canvas-toolbar" style="display:none;">
        <button class="tool-btn active" id="tool-paint" onclick="setTool('paint')">🖌 Paint</button>
        <button class="tool-btn" id="tool-fill" onclick="setTool('fill')">🪣 Fill</button>
        <button class="tool-btn" id="tool-erase" onclick="setTool('erase')">⌫ Erase</button>
        <button class="tool-btn" onclick="clearMap()" style="border-color:var(--red-dim);color:var(--red-dim);">🗑 Clear</button>
        <button class="tool-btn" onclick="saveCurrentMap()" style="border-color:var(--gold-dim);color:var(--gold);">💾 Save</button>
      </div>
      <div class="canvas-hint" id="canvas-hint" style="display:none;">Left-click: paint &middot; Right-drag: rotate<br/>Middle-drag: pan &middot; Scroll: zoom</div>
      <div class="canvas-info" id="canvas-info" style="display:none;"></div>
      <div class="zoom-btns" id="zoom-btns" style="display:none;">
        <button class="zoom-btn" onclick="zoomCamera(0.8)">+</button>
        <button class="zoom-btn" onclick="zoomCamera(1.25)">−</button>
        <button class="zoom-btn" onclick="resetCamera()" title="Reset view">⊙</button>
      </div>
    </div>

    <div class="palette-panel">
      <div class="palette-header">
        <h3>Tiles</h3>
        <div class="palette-tabs">
          <button class="pal-tab active" onclick="showPalette('nature')">Nature</button>
          <button class="pal-tab" onclick="showPalette('dungeon')">Dungeon</button>
        </div>
      </div>
      <div class="palette-tiles" id="palette-tiles"></div>
      <div class="session-bar">
        <button class="session-btn primary" id="session-btn" onclick="toggleSession()">▶ Start Session</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="new-map-modal">
    <div class="modal">
      <h3>New Map</h3>
      <div class="modal-fields">
        <div class="field"><label>Map Name</label><input id="new-map-name" placeholder="The Dark Dungeon" /></div>
        <div class="modal-row">
          <div class="field"><label>Width (tiles)</label><input id="new-map-w" type="number" value="30" min="5" max="80" /></div>
          <div class="field"><label>Height (tiles)</label><input id="new-map-h" type="number" value="20" min="5" max="80" /></div>
        </div>
        <div class="field"><label>Fill with</label>
          <select id="new-map-fill">
            <option value="empty">Empty (blank)</option>
            <option value="grass">Grass</option>
            <option value="stone_floor">Stone Floor</option>
            <option value="water">Water</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button onclick="closeNewMapModal()">Cancel</button>
        <button class="primary" onclick="createMap()">Create Map</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const { Auth, MapStore, MapSessionStore } = window;
    if (!Auth.require()) throw new Error('not logged in');
    const isDM = Auth.isDM();

    if (!isDM) {
      document.getElementById('map-layout').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:1rem;color:var(--text-dim);grid-column:1/-1;"><span style="font-size:2.5rem;">🔒</span><p style="font-style:italic;">Only the Dungeon Master can access the map editor.</p><a href="home.html"><button>Go Home</button></a></div>';
      throw new Error('not DM');
    }

    // ── Tile definitions (ids/colors kept identical to the previous 2D version,
    // so maps saved before this rewrite still load correctly) ──
    const TILES = {
      nature: [
        {id:'grass',        label:'Grass',        color:'#2d6a2d'},
        {id:'dark_grass',   label:'Dark Grass',   color:'#1a4a1a'},
        {id:'water',        label:'Water',        color:'#1a5a8a'},
        {id:'deep_water',   label:'Deep Water',   color:'#0a2a5a'},
        {id:'sand',         label:'Sand',         color:'#c8a84a'},
        {id:'dirt',         label:'Dirt',         color:'#8a5a2a'},
        {id:'snow',         label:'Snow',         color:'#d8e8f0'},
        {id:'ice',          label:'Ice',          color:'#a0c8e0'},
        {id:'lava',         label:'Lava',         color:'#c84a00'},
        {id:'volcanic',     label:'Volcanic',     color:'#4a1a00'},
        {id:'forest',       label:'Forest',       color:'#1a5a1a'},
        {id:'dense_forest', label:'Dense Forest', color:'#0a3a0a'},
        {id:'mountain',     label:'Mountain',     color:'#8a8a8a'},
        {id:'snow_peak',    label:'Snow Peak',    color:'#c0c0c0'},
        {id:'swamp',        label:'Swamp',        color:'#3a5a2a'},
        {id:'desert',       label:'Desert',       color:'#d4a84a'},
      ],
      dungeon: [
        {id:'stone_floor',  label:'Stone Floor',  color:'#5a5a5a'},
        {id:'dark_floor',   label:'Dark Floor',   color:'#3a3a3a'},
        {id:'wood_floor',   label:'Wood Floor',   color:'#6a4a2a'},
        {id:'wall',         label:'Wall',         color:'#2a2a2a'},
        {id:'brick_wall',   label:'Brick Wall',   color:'#5a3a2a'},
        {id:'door',         label:'Door',         color:'#8a5a1a'},
        {id:'locked_door',  label:'Locked Door',  color:'#6a2a1a'},
        {id:'stairs_up',    label:'Stairs Up',    color:'#7a7a7a'},
        {id:'stairs_down',  label:'Stairs Down',  color:'#4a4a4a'},
        {id:'chest',        label:'Chest',        color:'#a07820'},
        {id:'trap',         label:'Trap',         color:'#8a2020'},
        {id:'water_d',      label:'Water',        color:'#1a3a5a'},
        {id:'lava_d',       label:'Lava',         color:'#aa3a00'},
        {id:'pit',          label:'Pit',          color:'#0a0a0a'},
        {id:'altar',        label:'Altar',        color:'#6a4a8a'},
        {id:'pillar',       label:'Pillar',       color:'#3a3a5a'},
      ]
    };
    const ALL_TILES = [...TILES.nature, ...TILES.dungeon];
    function getTile(id) { return ALL_TILES.find(t => t.id === id) || null; }

    const FAMILY = {
      grass:'grass', dark_grass:'grass',
      water:'water', deep_water:'water', water_d:'water',
      sand:'flat', desert:'flat', dirt:'flat', snow:'flat', ice:'flat',
      stone_floor:'flat', dark_floor:'flat', wood_floor:'flat',
      lava:'lava', volcanic:'lava', lava_d:'lava',
      forest:'tree', dense_forest:'tree',
      mountain:'peak', snow_peak:'peak',
      swamp:'flat',
      wall:'wall', brick_wall:'wall',
      pillar:'pillar',
      door:'door', locked_door:'door',
      stairs_up:'stair', stairs_down:'stair',
      chest:'chest',
      trap:'trap',
      pit:'pit',
      altar:'altar',
    };

    function tileRand(gx, gy, salt) {
      let h = (gx * 374761393 + gy * 668265263 + salt * 2246822519) | 0;
      h = Math.imul(h ^ (h >>> 15), 2246822519);
      h = Math.imul(h ^ (h >>> 13), 3266489917);
      h = (h ^ (h >>> 16)) >>> 0;
      return h / 4294967296;
    }
    function shadeHex(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      if (amt >= 0) { r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }
      else { r *= (1+amt); g *= (1+amt); b *= (1+amt); }
      return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,'0')).join('');
    }

    // ── Three.js scene ──
    let scene, camera, renderer, controls, raycaster;
    let groundMesh = null, gridLines = null;
    let tileGroups = {};

    function buildToonGradient() {
      const c = document.createElement('canvas'); c.width = 4; c.height = 1;
      const ctx = c.getContext('2d');
      const shades = [70, 130, 190, 255];
      shades.forEach((v,i) => { ctx.fillStyle = 'rgb('+v+','+v+','+v+')'; ctx.fillRect(i,0,1,1); });
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter;
      return tex;
    }
    let toonGradientTex;

    const geometryCache = {};
    function geo(key, factory) { if (!geometryCache[key]) geometryCache[key] = factory(); return geometryCache[key]; }

    const materialCache = {};
    function toonMat(hex, opts) {
      opts = opts || {};
      const key = hex + '|' + JSON.stringify(opts);
      if (materialCache[key]) return materialCache[key];
      const params = { color: new THREE.Color(hex), gradientMap: toonGradientTex };
      if (opts.transparent) { params.transparent = true; params.opacity = opts.opacity != null ? opts.opacity : 1; }
      if (opts.emissive) { params.emissive = new THREE.Color(opts.emissive); params.emissiveIntensity = opts.emissiveIntensity != null ? opts.emissiveIntensity : 1; }
      const m = new THREE.MeshToonMaterial(params);
      materialCache[key] = m;
      return m;
    }

    function addTrees(group, tile, gx, gy) {
      const count = tile.id === 'dense_forest' ? 3 : 2;
      for (let i=0;i<count;i++) {
        const r1=tileRand(gx,gy,10+i*3), r2=tileRand(gx,gy,11+i*3), r3=tileRand(gx,gy,12+i*3);
        const px=(r1-0.5)*0.55, pz=(r2-0.5)*0.55, scale=0.75+r3*0.5;
        const trunk = new THREE.Mesh(geo('trunk',()=>new THREE.CylinderGeometry(0.05,0.07,0.35,6)), toonMat('#5a3a1a'));
        trunk.position.set(px,0.17*scale,pz); trunk.scale.setScalar(scale); trunk.castShadow=true;
        const canopy = new THREE.Mesh(geo('canopy',()=>new THREE.ConeGeometry(0.32,0.7,6)), toonMat(i%2===0?'#2f7a2f':'#3a8a35'));
        canopy.position.set(px,0.55*scale,pz); canopy.scale.setScalar(scale); canopy.castShadow=true;
        group.add(trunk,canopy);
      }
    }
    function addPeak(group, tile, gx, gy) {
      const rot = tileRand(gx,gy,20)*Math.PI;
      const cone = new THREE.Mesh(geo('peakCone',()=>new THREE.ConeGeometry(0.55,1.3,5)), toonMat(shadeHex(tile.color,-0.05)));
      cone.position.y=0.55; cone.rotation.y=rot; cone.castShadow=true;
      group.add(cone);
      if (tile.id==='snow_peak') {
        const cap = new THREE.Mesh(geo('peakCap',()=>new THREE.ConeGeometry(0.24,0.4,5)), toonMat('#f4f8fb'));
        cap.position.y=1.15; cap.rotation.y=rot; cap.castShadow=true;
        group.add(cap);
      }
    }
    function addWall(group, tile) {
      const wall = new THREE.Mesh(geo('wallBox',()=>new THREE.BoxGeometry(0.94,1.3,0.94)), toonMat(tile.color));
      wall.position.y=0.55; wall.castShadow=true; wall.receiveShadow=true;
      group.add(wall);
      if (tile.id==='brick_wall') {
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(wall.geometry), new THREE.LineBasicMaterial({color:0x000000, transparent:true, opacity:0.3}));
        edges.position.copy(wall.position);
        group.add(edges);
      }
    }
    function addPillar(group, tile) {
      const p = new THREE.Mesh(geo('pillarCyl',()=>new THREE.CylinderGeometry(0.28,0.32,1.3,8)), toonMat(tile.color));
      p.position.y=0.55; p.castShadow=true;
      group.add(p);
    }
    function addDoor(group, tile) {
      const door = new THREE.Mesh(geo('doorBox',()=>new THREE.BoxGeometry(0.6,1.05,0.14)), toonMat(tile.color));
      door.position.y=0.45; door.castShadow=true;
      group.add(door);
      const handle = new THREE.Mesh(geo('handleBall',()=>new THREE.SphereGeometry(0.05,8,8)), toonMat('#ffcc00'));
      handle.position.set(0.2,0.45,0.1);
      group.add(handle);
      if (tile.id==='locked_door') {
        const lock = new THREE.Mesh(geo('lockBox',()=>new THREE.BoxGeometry(0.14,0.12,0.05)), toonMat('#333333'));
        lock.position.set(0,0.45,0.11);
        group.add(lock);
      }
    }
    function addStairs(group, tile) {
      const up = tile.id === 'stairs_up';
      const steps = 4;
      for (let i=0;i<steps;i++) {
        const h=(i+1)*0.15;
        const step = new THREE.Mesh(geo('stairStep'+i,()=>new THREE.BoxGeometry(0.94/steps,1,0.94)), toonMat(shadeHex(tile.color, up?i*0.08:-i*0.08)));
        step.scale.y=h; step.position.set(-0.47+(0.94/steps)*(i+0.5), h/2, 0);
        step.castShadow=true; step.receiveShadow=true;
        group.add(step);
      }
    }
    function addChest(group, tile) {
      const body = new THREE.Mesh(geo('chestBody',()=>new THREE.BoxGeometry(0.55,0.35,0.4)), toonMat('#5a3a18'));
      body.position.y=0.2; body.castShadow=true;
      const lid = new THREE.Mesh(geo('chestLid',()=>new THREE.BoxGeometry(0.55,0.12,0.4)), toonMat('#7a4a20'));
      lid.position.y=0.43; lid.castShadow=true;
      const lock = new THREE.Mesh(geo('chestLock',()=>new THREE.SphereGeometry(0.05,8,8)), toonMat('#ffcc00'));
      lock.position.set(0,0.35,0.21);
      group.add(body,lid,lock);
    }
    function addTrapDecor(group) {
      const plate = new THREE.Mesh(geo('trapPlate',()=>new THREE.BoxGeometry(0.7,0.05,0.7)), toonMat('#7a2020',{emissive:'#4a0000',emissiveIntensity:0.3}));
      plate.position.y=0.02;
      group.add(plate);
      for (let i=0;i<3;i++) {
        const spike = new THREE.Mesh(geo('spike',()=>new THREE.ConeGeometry(0.04,0.22,5)), toonMat('#999999'));
        spike.position.set((i-1)*0.18,0.11,0); spike.castShadow=true;
        group.add(spike);
      }
    }
    function addAltar(group, tile) {
      const base = new THREE.Mesh(geo('altarBase',()=>new THREE.BoxGeometry(0.7,0.5,0.7)), toonMat(shadeHex(tile.color,-0.15)));
      base.position.y=0.25; base.castShadow=true; base.receiveShadow=true;
      const gem = new THREE.Mesh(geo('altarGem',()=>new THREE.OctahedronGeometry(0.14)), toonMat('#c896ff',{emissive:'#a060ff',emissiveIntensity:0.9}));
      gem.position.y=0.6;
      group.add(base,gem);
    }

    function buildTileGroup(tile, gx, gy) {
      const group = new THREE.Group();
      if (!tile) return group;
      const fam = FAMILY[tile.id] || 'flat';
      const jitter = (tileRand(gx,gy,1)-0.5)*0.05;
      const ground = new THREE.Mesh(geo('ground',()=>new THREE.BoxGeometry(0.98,0.2,0.98)), toonMat(tile.color));
      ground.position.y = -0.1 + jitter;
      ground.receiveShadow = true;
      if (fam === 'water') {
        ground.material = toonMat(tile.color, {transparent:true, opacity:0.82});
        ground.position.y = -0.22 + jitter*0.4;
      } else if (fam === 'lava') {
        ground.material = toonMat(tile.color, {emissive:tile.color, emissiveIntensity:0.55});
      } else if (fam === 'pit') {
        ground.material = toonMat('#0a0a0a');
        ground.position.y = -0.5;
      }
      group.add(ground);
      switch (fam) {
        case 'tree': addTrees(group, tile, gx, gy); break;
        case 'peak': addPeak(group, tile, gx, gy); break;
        case 'wall': addWall(group, tile); break;
        case 'pillar': addPillar(group, tile); break;
        case 'door': addDoor(group, tile); break;
        case 'stair': addStairs(group, tile); break;
        case 'chest': addChest(group, tile); break;
        case 'trap': addTrapDecor(group); break;
        case 'altar': addAltar(group, tile); break;
        default: break;
      }
      return group;
    }

    function initScene() {
      const container = document.getElementById('three-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color('#1a2230');
      scene.fog = new THREE.Fog('#1a2230', 14, 42);

      camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      toonGradientTex = buildToonGradient();

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.minDistance = 3;
      controls.maxDistance = 70;
      controls.mouseButtons = { MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };

      raycaster = new THREE.Raycaster();

      const hemi = new THREE.HemisphereLight('#bcd7ff', '#3a2f22', 0.95);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight('#fff4dd', 1.4);
      sun.position.set(9,15,7);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024,1024);
      const sc = sun.shadow.camera;
      sc.left=-30; sc.right=30; sc.top=30; sc.bottom=-30; sc.far=80;
      scene.add(sun);

      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      renderer.domElement.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
      window.addEventListener('resize', onResize);

      animate();
      onResize();
    }

    function onResize() {
      const wrap = document.getElementById('canvas-wrap');
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (!w || !h || !renderer) return;
      renderer.setSize(w,h);
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
    }
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function fitGround(map) {
      if (groundMesh) { scene.remove(groundMesh); groundMesh.geometry.dispose(); }
      const g = new THREE.PlaneGeometry(map.width, map.height);
      g.rotateX(-Math.PI/2);
      groundMesh = new THREE.Mesh(g, toonMat('#11151d'));
      groundMesh.position.set(map.width/2, -0.35, map.height/2);
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      if (gridLines) { scene.remove(gridLines); gridLines.geometry.dispose(); }
      const pts = [];
      for (let i=0;i<=map.width;i++) pts.push(i,0.001,0, i,0.001,map.height);
      for (let j=0;j<=map.height;j++) pts.push(0,0.001,j, map.width,0.001,j);
      const lg = new THREE.BufferGeometry();
      lg.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
      gridLines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({color:0x000000, transparent:true, opacity:0.15}));
      scene.add(gridLines);
    }

    function clearTileGroups() {
      for (const key in tileGroups) scene.remove(tileGroups[key]);
      tileGroups = {};
    }
    function setCellVisual(map, x, y, tileId) {
      const key = x+','+y;
      if (tileGroups[key]) { scene.remove(tileGroups[key]); delete tileGroups[key]; }
      const group = buildTileGroup(getTile(tileId), x, y);
      group.position.set(x+0.5, 0, y+0.5);
      scene.add(group);
      tileGroups[key] = group;
    }
    function rebuildWholeMap(map) {
      clearTileGroups();
      fitGround(map);
      for (let y=0;y<map.height;y++) for (let x=0;x<map.width;x++) setCellVisual(map, x, y, map.tiles[y][x]);
    }

    function frameCamera(map) {
      // Fixed, readable default distance regardless of map size (matches how the
      // old 2D version started zoomed-in and relied on pan/zoom for large maps,
      // rather than shrinking tiles to fit the whole map in view).
      const cx = map.width/2, cz = map.height/2;
      controls.target.set(cx,0,cz);
      camera.position.set(cx - 5, 10, cz + 11);
      controls.update();
    }
    window.zoomCamera = function(factor) {
      const offset = new THREE.Vector3().subVectors(camera.position, controls.target).multiplyScalar(factor);
      camera.position.copy(controls.target).add(offset);
      controls.update();
    };
    window.resetCamera = function() { if (currentMapId) frameCamera(maps[currentMapId]); };

    // ── Raycasting / painting ──
    const _ndc = new THREE.Vector2();
    const _groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
    const _hit = new THREE.Vector3();
    function screenToGrid(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      _ndc.x = ((clientX-rect.left)/rect.width)*2-1;
      _ndc.y = -((clientY-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(_ndc, camera);
      if (!raycaster.ray.intersectPlane(_groundPlane, _hit)) return null;
      return { x: Math.floor(_hit.x), y: Math.floor(_hit.z) };
    }
    function paintCell(map, x, y) {
      if (x<0||y<0||x>=map.width||y>=map.height) return;
      if (currentTool==='erase') { map.tiles[y][x]=null; setCellVisual(map,x,y,null); }
      else if (currentTool==='paint' && selectedTile) { map.tiles[y][x]=selectedTile.id; setCellVisual(map,x,y,selectedTile.id); }
    }
    function floodFill(map, tx, ty) {
      if (!selectedTile || tx<0||ty<0||tx>=map.width||ty>=map.height) return;
      const target = map.tiles[ty][tx], rep = selectedTile.id;
      if (target===rep) return;
      const stack=[[tx,ty]];
      while (stack.length) {
        const [x,y] = stack.pop();
        if (x<0||y<0||x>=map.width||y>=map.height||map.tiles[y][x]!==target) continue;
        map.tiles[y][x]=rep;
        setCellVisual(map,x,y,rep);
        stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
      }
    }
    let isPaintingDrag = false;
    function onPointerDown(e) {
      if (e.button!==0 || !currentMapId) return;
      const cell = screenToGrid(e.clientX, e.clientY);
      if (!cell) return;
      const map = maps[currentMapId];
      if (currentTool==='fill') floodFill(map, cell.x, cell.y);
      else { isPaintingDrag = true; paintCell(map, cell.x, cell.y); }
    }
    function onPointerMove(e) {
      if (!isPaintingDrag || !currentMapId) return;
      const cell = screenToGrid(e.clientX, e.clientY);
      if (cell) paintCell(maps[currentMapId], cell.x, cell.y);
    }
    function onPointerUp() { isPaintingDrag = false; }

    // ── State ──
    let maps = {}, currentMapId = null, selectedTile = null;
    let currentPalette = 'nature', currentTool = 'paint';

    async function loadMaps() { maps = await MapStore.getMaps(); renderMapsList(); }
    async function saveCurrentMap() {
      if (!currentMapId) return;
      const ok = await MapStore.saveMaps(maps);
      flash(ok ? 'Saved!' : 'Save failed');
    }
    function flash(msg) { document.getElementById('canvas-info').textContent = msg; setTimeout(updateInfo, 2000); }

    function renderMapsList() {
      const list=document.getElementById('maps-list');
      const ids=Object.keys(maps);
      if (!ids.length) { list.innerHTML='<div style="color:var(--text-dim);font-size:0.8rem;font-style:italic;padding:8px;">No maps yet.</div>'; return; }
      list.innerHTML='';
      ids.forEach(id => {
        const m=maps[id], div=document.createElement('div');
        div.className='map-item'+(id===currentMapId?' active':'');
        div.innerHTML='<button class="map-item-del" onclick="deleteMap(\''+id+'\',event)">✕</button><div class="map-item-name">'+m.name+'</div><div class="map-item-size">'+m.width+'×'+m.height+'</div>';
        div.onclick=()=>loadMap(id);
        list.appendChild(div);
      });
    }
    window.openNewMapModal = function() { document.getElementById('new-map-modal').classList.add('open'); setTimeout(()=>document.getElementById('new-map-name').focus(),50); };
    window.closeNewMapModal = function() { document.getElementById('new-map-modal').classList.remove('open'); };
    document.getElementById('new-map-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeNewMapModal();});

    window.createMap = function() {
      const name=document.getElementById('new-map-name').value.trim()||'Unnamed Map';
      const w=Math.min(80,Math.max(5,parseInt(document.getElementById('new-map-w').value)||30));
      const h=Math.min(80,Math.max(5,parseInt(document.getElementById('new-map-h').value)||20));
      const fill=document.getElementById('new-map-fill').value;
      const id='map_'+Date.now();
      const tiles=[];
      for(let y=0;y<h;y++){tiles.push([]);for(let x=0;x<w;x++)tiles[y].push(fill==='empty'?null:fill);}
      maps[id]={id,name,width:w,height:h,tiles,created:Date.now()};
      closeNewMapModal();
      document.getElementById('new-map-name').value='';
      renderMapsList(); loadMap(id); saveCurrentMap();
    };
    window.deleteMap = async function(id,e) {
      e.stopPropagation();
      if(!confirm('Delete "'+maps[id].name+'"?')) return;
      delete maps[id];
      await MapStore.saveMaps(maps);
      if(currentMapId===id){currentMapId=null;hideViewport();}
      renderMapsList();
    };
    function loadMap(id) {
      currentMapId=id;
      renderMapsList(); showViewport();
      const map = maps[id];
      rebuildWholeMap(map);
      frameCamera(map);
      updateInfo();
    }
    function showViewport() {
      document.getElementById('no-map-msg').style.display='none';
      document.getElementById('three-container').style.display='block';
      document.getElementById('canvas-toolbar').style.display='flex';
      document.getElementById('canvas-hint').style.display='block';
      document.getElementById('canvas-info').style.display='block';
      document.getElementById('zoom-btns').style.display='flex';
      onResize();
    }
    function hideViewport() {
      document.getElementById('no-map-msg').style.display='flex';
      document.getElementById('three-container').style.display='none';
      document.getElementById('canvas-toolbar').style.display='none';
      document.getElementById('canvas-hint').style.display='none';
      document.getElementById('canvas-info').style.display='none';
      document.getElementById('zoom-btns').style.display='none';
      clearTileGroups();
    }
    function updateInfo() {
      if(!currentMapId) return;
      const m=maps[currentMapId];
      document.getElementById('canvas-info').textContent=m.name+' · '+m.width+'×'+m.height;
    }

    window.setTool = function(t) {
      currentTool=t;
      ['paint','fill','erase'].forEach(n=>document.getElementById('tool-'+n).classList.toggle('active',n===t));
    };
    window.clearMap = function() {
      if(!currentMapId||!confirm('Clear the entire map?')) return;
      const map=maps[currentMapId];
      for(let y=0;y<map.height;y++) for(let x=0;x<map.width;x++) { map.tiles[y][x]=null; setCellVisual(map,x,y,null); }
    };
    window.saveCurrentMap = saveCurrentMap;

    // ── Palette ──
    window.showPalette = function(type) {
      currentPalette=type;
      document.querySelectorAll('.pal-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&type==='nature')||(i===1&&type==='dungeon')));
      renderPalette();
    };
    function renderPalette() {
      const container=document.getElementById('palette-tiles');
      container.innerHTML='';
      const eraser=document.createElement('button');
      eraser.className='tile-btn eraser-btn'+(currentTool==='erase'?' selected':'');
      eraser.innerHTML='<div class="tile-swatch" style="background:#1a0a0a;color:#cc3333;">⌫</div><div class="tile-label">Erase</div>';
      eraser.onclick=()=>{setTool('erase');renderPalette();};
      container.appendChild(eraser);
      TILES[currentPalette].forEach(tile=>{
        const btn=document.createElement('button');
        btn.className='tile-btn'+(selectedTile&&selectedTile.id===tile.id?' selected':'');
        btn.innerHTML='<div class="tile-swatch" style="background:'+tile.color+';"></div><div class="tile-label">'+tile.label+'</div>';
        btn.onclick=()=>{selectedTile=tile;setTool('paint');renderPalette();};
        container.appendChild(btn);
      });
    }

    // ── Session ──
    let sessionActive = false;
    window.toggleSession = async function() {
      sessionActive=!sessionActive;
      const btn=document.getElementById('session-btn');
      btn.textContent=sessionActive?'⬛ End Session':'▶ Start Session';
      btn.classList.toggle('live',sessionActive);
      await MapSessionStore.set({active:sessionActive,mapId:currentMapId||null,ts:Date.now()});
    };

    initScene();
    renderPalette();
    loadMaps();
  </script>
</body>
</html>
